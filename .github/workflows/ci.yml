name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: actions/checkout@v7

     - name: Set up JDK
       uses: actions/setup-java@v6
       with:
         distribution: temurin
         java-version: 25

     - name: Set up Gradle (with cache)
       uses: gradle/actions/setup-gradle@v6

     - name: Build and test
       run: ./gradlew build
